[project]
name = "signal-types-clustering"
version = "0.1.0"
description = "Clustering scintillation detector signals with PSD features, UMAP, and unsupervised learning models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hdbscan>=0.8.40",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "umap-learn>=0.5.5",
]

[tool.uv]
package = false
